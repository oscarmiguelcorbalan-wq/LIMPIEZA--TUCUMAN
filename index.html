<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Limpieza – Depto Tucumán</title>
<style>
  /* ====== CONFIGURACIÓN ====== */
  :root{
    --verde:#0f766e; --verde2:#14b8a6; --fondo:#f4f6f5; --tarjeta:#fff;
    --texto:#1f2a2a; --gris:#6b7776; --borde:#e2e8e6; --naranja:#ea580c; --naranjaFondo:#fff4ec;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--texto);font-size:16px}
  header{background:var(--verde);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:19px}
  header small{opacity:.85}
  .tabs{display:flex;margin-top:10px}
  .tabs button{flex:1;background:none;border:0;color:#ffffffb0;font-size:15px;font-weight:600;padding:10px 0;border-bottom:3px solid transparent}
  .tabs button.on{color:#fff;border-color:#fff}
  .barra{height:6px;background:#ffffff40;margin:0 -16px}
  .barra div{height:100%;background:#fde68a;width:0;transition:width .3s}
  main{padding:14px;max-width:640px;margin:auto;padding-bottom:110px}
  .card{background:var(--tarjeta);border-radius:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden}
  .pad{padding:14px}
  label.campo{display:block;font-size:13px;color:var(--gris);margin:10px 0 4px;font-weight:600}
  input[type=text],input[type=date],select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--borde);border-radius:10px;background:#fff;font-family:inherit;color:inherit}
  textarea{min-height:60px;resize:vertical}
  .fila{display:flex;gap:10px}.fila>*{flex:1}
  .secHead{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;user-select:none}
  .secHead .ico{font-size:24px}
  .secHead .tit{flex:1;font-weight:700}
  .secHead .cnt{font-size:13px;font-weight:700;color:var(--gris);background:var(--fondo);padding:4px 9px;border-radius:20px}
  .secHead .cnt.ok{background:#d1fae5;color:#047857}
  .secHead .flecha{transition:transform .2s;color:var(--gris)}
  .sec.abierta .flecha{transform:rotate(90deg)}
  .secBody{display:none;border-top:1px solid var(--borde)}
  .sec.abierta .secBody{display:block}
  .sub{padding:10px 14px 4px;font-weight:700;color:var(--verde);font-size:14px}
  .nota{margin:8px 14px;padding:10px;border-radius:10px;background:#eef9f7;color:var(--verde);font-size:14px;font-weight:600}
  .item{border-bottom:1px solid var(--borde)}
  .item:last-child{border-bottom:0}
  .itemRow{display:flex;align-items:center;gap:12px;padding:12px 14px}
  .chk{width:28px;height:28px;border:2px solid #b8c4c2;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;transition:.15s}
  .item.hecho .chk{background:var(--verde2);border-color:var(--verde2)}
  .item.hecho .txt{color:var(--gris);text-decoration:line-through}
  .txt{flex:1;line-height:1.3}
  .alerta{flex:none;border:1px solid var(--borde);background:#fff;border-radius:9px;width:38px;height:34px;font-size:17px}
  .item.inc{background:var(--naranjaFondo)}
  .item.inc .alerta{border-color:var(--naranja);background:var(--naranja)}
  .fotoBox{padding:0 14px 12px 54px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .btnFoto{border:1px dashed var(--verde);background:#eef9f7;color:var(--verde);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700}
  .mini{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#e5e7eb}
  .mini img{width:100%;height:100%;object-fit:cover;display:block}
  .mini .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:13px;line-height:22px;padding:0}
  .mini .est{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fffc;font-size:11px;font-weight:700;color:var(--verde);text-align:center}
  .mini.error .est{color:#b91c1c}
  .galeria{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .galeria a{display:block;width:72px;height:72px;border-radius:8px;overflow:hidden;background:#e5e7eb}
  .galeria img{width:100%;height:100%;object-fit:cover}
  .incBox{display:none;padding:0 14px 12px 54px}
  .item.verInc .incBox{display:block}
  .incBox textarea{border-color:#fdba74;min-height:50px}
  .btnTodo{display:block;margin:10px 14px 12px auto;background:none;border:1px solid var(--verde);color:var(--verde);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
  .switch{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fffbeb;border-top:1px solid var(--borde);font-size:14px}
  .switch input{width:22px;height:22px}
  .pie{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.1);display:flex;gap:10px;z-index:9}
  .btn{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--verde);color:#fff}
  .btn.sec2{background:#e6f2f0;color:var(--verde);flex:.6}
  .btn:disabled{opacity:.5}
  .final{display:flex;gap:10px;margin-top:6px}
  .final button{flex:1;padding:12px;border-radius:10px;border:2px solid var(--borde);background:#fff;font-size:16px;font-weight:700}
  .final button.on.si{border-color:#059669;background:#d1fae5;color:#047857}
  .final button.on.no{border-color:#dc2626;background:#fee2e2;color:#b91c1c}
  .importante{font-size:14px;background:#fef3c7;border-radius:10px;padding:10px;margin-top:12px}
  .hist{padding:14px;border-bottom:1px solid var(--borde);cursor:pointer}
  .hist:last-child{border-bottom:0}
  .hist .l1{display:flex;justify-content:space-between;font-weight:700}
  .hist .l2{font-size:14px;color:var(--gris);margin-top:3px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:12px;margin:4px 4px 0 0}
  .tag.ok{background:#d1fae5;color:#047857}.tag.no{background:#fee2e2;color:#b91c1c}
  .tag.inc{background:var(--naranjaFondo);color:var(--naranja)}.tag.prof{background:#ede9fe;color:#6d28d9}
  .detalle{display:none;margin-top:10px;font-size:14px;line-height:1.45}
  .hist.abierta .detalle{display:block}
  .detalle h4{margin:10px 0 4px;font-size:13px;color:var(--verde);text-transform:uppercase}
  .detalle ul{margin:0;padding-left:18px}
  .vacio{text-align:center;color:var(--gris);padding:30px 14px}
  .aviso{background:#fef3c7;color:#92400e;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:12px}
  .toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#1f2a2a;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:90%;text-align:center}
  .toast.on{opacity:1}
  .modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:30}
  .modal.on{display:flex}
  .modal .caja{background:#fff;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:640px}
  .modal h3{margin:0 0 8px}
  .modal p{margin:0 0 14px;color:var(--gris);font-size:15px}
  .modal .fila .btn{flex:1}
  .oculto{display:none!important}
  .filtro{display:flex;gap:8px;margin-bottom:12px}
</style>
</head>
<body>

<header>
  <h1>🧹 Limpieza – Depto Tucumán</h1>
  <small id="subtit">Checklist Airbnb</small>
  <div class="tabs">
    <button id="tabCheck" class="on" onclick="verTab('check')">Checklist</button>
    <button id="tabHist" onclick="verTab('hist')">Historial</button>
  </div>
  <div class="barra" id="barraWrap"><div id="barra"></div></div>
</header>

<main id="vistaCheck">
  <div id="avisoDemo" class="aviso oculto">Modo prueba: el historial se guarda solo en este teléfono hasta que se configure la hoja de Google.</div>

  <div class="card pad">
    <div class="fila">
      <div>
        <label class="campo">Responsable</label>
        <select id="responsable" onchange="cambioResp()"></select>
      </div>
      <div>
        <label class="campo">Fecha</label>
        <input type="date" id="fecha" onchange="guardarBorrador()">
      </div>
    </div>
    <input type="text" id="otroNombre" class="oculto" placeholder="Escribe tu nombre" style="margin-top:8px" oninput="guardarBorrador()">
  </div>

  <div id="secciones"></div>

  <div class="card pad">
    <div style="font-weight:700;font-size:17px">⚠️ Observaciones</div>
    <label class="campo">Desperfectos encontrados</label>
    <textarea id="obsDesperfectos" oninput="guardarBorrador()" placeholder="Describe el desperfecto y añade fotos si hace falta"></textarea>
    <div class="fotoBox" id="fb_obs_desp" style="padding:8px 0 0"></div>
    <label class="campo">Productos que faltan</label>
    <textarea id="obsProductos" oninput="guardarBorrador()"></textarea>
    <label class="campo">Objetos olvidados por huéspedes</label>
    <textarea id="obsObjetos" oninput="guardarBorrador()"></textarea>
    <label class="campo">Otros comentarios</label>
    <textarea id="obsOtros" oninput="guardarBorrador()"></textarea>

    <label class="campo" style="margin-top:16px">Limpieza finalizada</label>
    <div class="final">
      <button id="finSi" class="si" onclick="setFinal('SÍ')">✅ SÍ</button>
      <button id="finNo" class="no" onclick="setFinal('NO')">❌ NO</button>
    </div>
    <div class="importante"><b>IMPORTANTE:</b> El departamento debe quedar limpio, ordenado, sin olores y preparado como si fuera a recibir a su primer huésped.</div>
  </div>
</main>

<main id="vistaHist" class="oculto">
  <div class="filtro">
    <select id="filtroResp" onchange="pintarHistorial()"><option value="">Todas</option></select>
    <button class="btn sec2" style="flex:none;padding:10px 14px" onclick="cargarHistorial()">↻ Actualizar</button>
  </div>
  <div class="card" id="listaHist"><div class="vacio">Cargando…</div></div>
</main>

<div class="pie" id="pie">
  <button class="btn sec2" onclick="pedirReinicio()">Vaciar</button>
  <button class="btn" id="btnGuardar" onclick="pedirGuardar()">Guardar limpieza</button>
</div>

<div class="modal" id="modal"><div class="caja">
  <h3 id="mTit"></h3><p id="mTxt"></p>
  <div class="fila"><button class="btn sec2" onclick="cerrarModal()">Cancelar</button><button class="btn" id="mOk">Aceptar</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIGURACIÓN
   Pega aquí la URL de la app web de Apps Script (termina en /exec).
   Si se deja vacía, la app funciona en "modo prueba" y guarda en el teléfono.
   ========================================================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZKnnqYSlfO7i25gLPGZGcbiwilQHlAhgQfnm8OQOAxX44Nkb4xXSWl1FwBBw65yke1g/exec";
const RESPONSABLES = ["Mónica", "Rosa", "Otra"];

/* ====== CHECKLIST ====== */
const CHECKLIST = [
 {id:"dorm", ico:"🛏️", t:"1. Dormitorio", items:[
  "Retirar sábanas y fundas usadas.","Colocar ropa de cama limpia y bien estirada.","Revisar almohadas, colchón y protector.",
  "Limpiar mesas de luz y muebles.","Quitar polvo de lámparas y cabecera.","Limpiar espejos y vidrios.",
  "Revisar interior de placares y cajones.","Limpiar debajo de la cama.","Aspirar o barrer y trapear el piso.",
  "Comprobar funcionamiento del aire acondicionado.","Revisar cortinas blackout."]},
 {id:"bano", ico:"🚿", t:"2. Baño", items:[
  "Desinfectar inodoro completo, incluida base y parte trasera.","Limpiar lavamanos, grifería y mesada.","Limpiar ducha, paredes y desagüe.",
  "Eliminar pelos y restos de jabón.","Limpiar espejo sin dejar marcas.","Limpiar muebles y estantes.","Revisar y limpiar rejillas.",
  "Colocar papel higiénico nuevo y repuesto.","Colocar toallas limpias y bien dobladas.","Vaciar, lavar y colocar bolsa nueva en el cesto.",
  "Trapear y desinfectar piso.","Verificar ausencia de olores."]},
 {id:"coci", ico:"🍳", t:"3. Cocina", items:[
  "Lavar y guardar vajilla, vasos y cubiertos.","Limpiar mesada y bacha.","Limpiar grifería y retirar restos de cal.",
  "Limpiar cocina y hornallas.","Limpiar frente y mandos de electrodomésticos.","Limpiar microondas por dentro y por fuera.",
  "Limpiar heladera por dentro y por fuera.","Revisar que no queden alimentos de huéspedes anteriores.","Limpiar puertas y tiradores de alacenas.",
  "Revisar cajones y utensilios.","Vaciar basura y colocar bolsa nueva.","Barrer y trapear piso.",
  {sub:"🔥 Limpieza interior del horno"},
  "Retirar bandejas y rejillas.","Eliminar restos de comida y grasa.","Limpiar paredes interiores, techo y base.",
  "Limpiar cristal interior de la puerta.","Desengrasar rejillas y bandejas.","Limpiar juntas y bordes de la puerta.",
  "Retirar completamente residuos del producto limpiador.","Secar y volver a colocar accesorios.","Comprobar que no queden olores ni restos de grasa."]},
 {id:"salo", ico:"🛋️", t:"4. Salón y comedor", items:[
  "Sacudir y acomodar almohadones.","Revisar sofá y sofá cama.","Limpiar debajo y entre los almohadones.",
  "Revisar que no haya objetos olvidados.","Limpiar mesa y sillas.","Quitar polvo de muebles y estantes.",
  "Limpiar televisor con paño adecuado.","Limpiar controles remotos.","Limpiar ventanas y espejos.","Revisar cortinas.",
  "Barrer y trapear piso.","Ordenar decoración."]},
 {id:"entr", ico:"🚪", t:"5. Entrada y zonas generales", items:[
  "Limpiar puerta de entrada y manijas.","Desinfectar interruptores.","Limpiar picaportes de todas las puertas.",
  "Limpiar zócalos visibles.","Revisar paredes y quitar manchas.","Limpiar ventanas y marcos.","Quitar telarañas.",
  "Revisar rincones y detrás de puertas.","Comprobar iluminación.","Revisar cerradura y sistema de acceso."]},
 {id:"prof", ico:"🧽", t:"6. Limpieza profunda periódica", opcional:true, items:[
  "Mover muebles accesibles y limpiar detrás.","Limpiar debajo de camas y sofá.","Limpiar interior de placares y cajones.",
  "Desengrasar campana o purificador de cocina.","Revisar y limpiar filtros del purificador.","Limpiar filtros del aire acondicionado.",
  "Limpiar rejillas de ventilación.","Lavar cortinas cuando corresponda.","Limpiar vidrios completos y marcos.",
  "Desinfectar cestos de basura.","Limpiar azulejos y juntas.","Revisar manchas en paredes y tapizados.",
  "Limpiar interior del horno en profundidad."]},
 {id:"insu", ico:"🧴", t:"7. Reposición de insumos", nota:"Avisar si algún producto está por terminarse (anótalo con ⚠️).", items:[
  "Papel higiénico suficiente.","Jabón de manos.","Detergente para vajilla.","Esponja limpia y en buen estado.",
  "Bolsas de basura.","Ropa de cama limpia.","Toallas limpias.","Elementos de limpieza disponibles."]},
 {id:"ctrl", ico:"🔍", t:"8. Control final antes del check-in", items:[
  "Todas las habitaciones limpias y ordenadas.","Camas perfectamente preparadas.","Baño seco, limpio y sin pelos.",
  "Cocina limpia y sin restos de comida.","Heladera limpia y funcionando.","Horno limpio y apagado.","Electrodomésticos revisados.",
  "No quedan objetos de huéspedes anteriores.","No hay olores desagradables.","Todas las luces funcionan.","Ventanas cerradas.",
  "Aire acondicionado apagado.","Basura retirada del departamento y depositada en contenedores.",
  "Puerta y cerradura funcionando correctamente.","Departamento listo para recibir huéspedes."]},
 {id:"foto", ico:"📸", t:"9. Fotos obligatorias al finalizar", fotos:true, nota:"Toca 📷 para sacar la foto o elegirla de la galería. Se guardan solas en el historial.", items:[
  "Foto general del dormitorio con cama preparada.","Foto del baño completo.","Foto de la cocina y mesada.",
  "Foto del interior del horno limpio.","Foto del salón y comedor.","Foto de la entrada del departamento.",
  "Foto de cualquier daño, desperfecto o anomalía."]}
];

/* ====== ESTADO ====== */
const LS_BORRADOR = "tucuman_borrador_v1", LS_DEMO = "tucuman_historial_demo", LS_PEND = "tucuman_pendientes";
let st = nuevoEstado();
let historial = [];

function nuevoEstado(){
  return {id:"L"+Date.now(), hechos:{}, inc:{}, fotos:{}, profunda:false, final:"", inicio:new Date().toISOString(),
          fecha:hoy(), responsable:"", otro:"", obs:{d:"",p:"",o:"",c:""}};
}
function hoy(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function key(s,i){return s+"_"+i;}

/* ====== PINTAR CHECKLIST ====== */
function pintar(){
  const cont = document.getElementById("secciones");
  cont.innerHTML = "";
  CHECKLIST.forEach(sec=>{
    const div = document.createElement("div");
    div.className = "card sec"; div.id = "sec_"+sec.id;
    let html = `<div class="secHead" onclick="toggleSec('${sec.id}')"><span class="ico">${sec.ico}</span><span class="tit">${sec.t}</span><span class="cnt" id="cnt_${sec.id}"></span><span class="flecha">▶</span></div>`;
    if(sec.opcional){
      html += `<label class="switch" onclick="event.stopPropagation()"><input type="checkbox" id="swProf" ${st.profunda?"checked":""} onchange="setProfunda(this.checked)"> Hoy toca limpieza profunda (si no, esta sección no cuenta)</label>`;
    }
    html += `<div class="secBody">`;
    if(sec.nota) html += `<div class="nota">${sec.nota}</div>`;
    let n=0;
    sec.items.forEach(it=>{
      if(typeof it==="object"){html += `<div class="sub">${it.sub}</div>`;return;}
      const k = key(sec.id,n++);
      const inc = st.inc[k]||"";
      html += `<div class="item ${st.hechos[k]?"hecho":""} ${inc?"inc":""}" id="it_${k}">
        <div class="itemRow"><div class="chk" onclick="toggleItem('${k}')">✓</div><div class="txt" onclick="toggleItem('${k}')">${it}</div>
        <button class="alerta" onclick="toggleInc('${k}')" title="Anotar incidencia">⚠️</button></div>
        <div class="incBox"><textarea placeholder="Describe la incidencia…" oninput="setInc('${k}',this.value)">${esc(inc)}</textarea></div>
        ${sec.fotos?`<div class="fotoBox" id="fb_${k}"></div>`:""}</div>`;
    });
    html += `<button class="btnTodo" onclick="marcarTodo('${sec.id}')">Marcar toda la sección</button></div>`;
    div.innerHTML = html;
    cont.appendChild(div);
    if(sec.fotos) itemsDe(sec).forEach((_,i)=>pintarFotos(key(sec.id,i)));
  });
  pintarFotos("obs_desp");
  actualizarContadores();
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function itemsDe(sec){return sec.items.filter(i=>typeof i==="string");}

function toggleSec(id){document.getElementById("sec_"+id).classList.toggle("abierta");}
function toggleItem(k){
  st.hechos[k] = !st.hechos[k]; if(!st.hechos[k]) delete st.hechos[k];
  document.getElementById("it_"+k).classList.toggle("hecho", !!st.hechos[k]);
  actualizarContadores(); guardarBorrador();
}
function toggleInc(k){
  const el = document.getElementById("it_"+k);
  el.classList.toggle("verInc");
  if(el.classList.contains("verInc")) el.querySelector("textarea").focus();
}
function setInc(k,v){
  if(v.trim()) st.inc[k]=v; else delete st.inc[k];
  document.getElementById("it_"+k).classList.toggle("inc", !!v.trim());
  guardarBorrador();
}
function marcarTodo(id){
  const sec = CHECKLIST.find(s=>s.id===id);
  const n = itemsDe(sec).length;
  const todos = [...Array(n).keys()].every(i=>st.hechos[key(id,i)]);
  for(let i=0;i<n;i++){ if(todos) delete st.hechos[key(id,i)]; else st.hechos[key(id,i)]=true; }
  pintarManteniendoAbiertas(); guardarBorrador();
}
function pintarManteniendoAbiertas(){
  const ab = [...document.querySelectorAll(".sec.abierta")].map(e=>e.id);
  pintar(); ab.forEach(id=>document.getElementById(id)?.classList.add("abierta"));
}
/* ====== FOTOS ====== */
const vistaPrevia = {};           // uid -> dataURL (solo en memoria)
let colaFotos = Promise.resolve(); // subidas de una en una
let subiendo = 0;
function thumbDrive(id,sz){return `https://drive.google.com/thumbnail?id=${id}&sz=w${sz||300}`;}
function pintarFotos(k){
  const box = document.getElementById("fb_"+k); if(!box) return;
  const fs = st.fotos[k]||[];
  box.innerHTML = fs.map(f=>{
    const src = vistaPrevia[f.uid] || f.local || (f.fileId?thumbDrive(f.fileId,200):"");
    const est = f.estado==="subiendo" ? "Subiendo…" : f.estado==="error" ? "Error<br>toca ↻" : "";
    return `<div class="mini ${f.estado==="error"?"error":""}">${src?`<img src="${src}" alt="">`:""}
      ${est?`<div class="est" ${f.estado==="error"?`onclick="reintentarFoto('${k}','${f.uid}')"`:""}>${est}</div>`:""}
      <button class="x" onclick="quitarFoto('${k}','${f.uid}')">✕</button></div>`;
  }).join("") + `<label class="btnFoto">📷 ${fs.length?"Otra":"Añadir foto"}<input type="file" accept="image/*" multiple hidden onchange="elegirFotos('${k}',this)"></label>`;
}
function elegirFotos(k,input){
  const files=[...input.files]; input.value="";
  files.forEach(file=>{
    const f = {uid:"f"+Date.now()+Math.random().toString(36).slice(2,6), estado:"subiendo"};
    (st.fotos[k] ||= []).push(f);
    pintarFotos(k);
    comprimir(file).then(dataURL=>{ vistaPrevia[f.uid]=dataURL; f.local=dataURL; pintarFotos(k); encolar(k,f); })
      .catch(()=>{ f.estado="error"; pintarFotos(k); toast("No se pudo leer esa imagen"); });
  });
  if(files.length && k!=="obs_desp" && !st.hechos[k]) toggleItem(k);
}
function comprimir(file){
  return new Promise((ok,ko)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const max=1600, r=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg",0.75));
    };
    img.onerror = ()=>{URL.revokeObjectURL(url); ko();};
    img.src = url;
  });
}
function textoItem(k){
  if(k==="obs_desp") return "Desperfecto";
  const [sid,i]=k.split("_"); const sec=CHECKLIST.find(s=>s.id===sid);
  const t = itemsDe(sec)[+i].replace(/^Foto (general )?(del |de la |de )?/i,"").replace(/\.$/,"");
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function encolar(k,f){
  subiendo++; f.estado="subiendo"; pintarFotos(k);
  colaFotos = colaFotos.then(()=>subirFoto(k,f)).finally(()=>{subiendo--; guardarBorrador();});
}
async function subirFoto(k,f){
  if(!SCRIPT_URL){ f.estado="ok"; pintarFotos(k); return; } // modo prueba: queda en el teléfono
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({accion:"foto", limpiezaId:st.id, nombre:textoItem(k), data:f.local.split(",")[1]})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error);
    f.fileId=j.fileId; f.estado="ok"; delete f.local;
  }catch(e){ f.estado="error"; }
  pintarFotos(k);
}
function reintentarFoto(k,uid){ const f=(st.fotos[k]||[]).find(x=>x.uid===uid); if(f&&f.local) encolar(k,f); }
function quitarFoto(k,uid){
  const fs=st.fotos[k]||[], f=fs.find(x=>x.uid===uid); if(!f) return;
  if(f.estado==="subiendo") return toast("Espera a que termine de subir");
  st.fotos[k]=fs.filter(x=>x.uid!==uid);
  if(f.fileId && SCRIPT_URL) fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({accion:"borrarFoto",fileId:f.fileId})}).catch(()=>{});
  pintarFotos(k); guardarBorrador();
}
function todasLasFotos(){
  const out=[]; Object.entries(st.fotos).forEach(([k,fs])=>fs.forEach(f=>out.push({k,f}))); return out;
}

function setProfunda(v){st.profunda=v; actualizarContadores(); guardarBorrador();}
function setFinal(v){
  st.final = st.final===v ? "" : v;
  document.getElementById("finSi").classList.toggle("on", st.final==="SÍ");
  document.getElementById("finNo").classList.toggle("on", st.final==="NO");
  guardarBorrador();
}

function contar(){
  let total=0, hechos=0;
  CHECKLIST.forEach(sec=>{
    const n = itemsDe(sec).length; let h=0;
    for(let i=0;i<n;i++) if(st.hechos[key(sec.id,i)]) h++;
    sec._h=h; sec._n=n;
    if(sec.opcional && !st.profunda) return;
    total+=n; hechos+=h;
  });
  return {total,hechos};
}
function actualizarContadores(){
  const {total,hechos} = contar();
  CHECKLIST.forEach(sec=>{
    const c = document.getElementById("cnt_"+sec.id); if(!c) return;
    c.textContent = (sec.opcional && !st.profunda) ? "Opcional" : sec._h+"/"+sec._n;
    c.classList.toggle("ok", sec._h===sec._n && !(sec.opcional && !st.profunda));
  });
  document.getElementById("barra").style.width = (total?hechos/total*100:0)+"%";
  document.getElementById("subtit").textContent = `Checklist Airbnb · ${hechos} de ${total} tareas`;
}

/* ====== CABECERA / OBSERVACIONES ====== */
function initCampos(){
  const sel = document.getElementById("responsable"), f = document.getElementById("filtroResp");
  sel.innerHTML = `<option value="">— Elegir —</option>` + RESPONSABLES.map(r=>`<option>${r}</option>`).join("");
  RESPONSABLES.filter(r=>r!=="Otra").forEach(r=>f.insertAdjacentHTML("beforeend",`<option>${r}</option>`));
  cargarCampos();
}
function cargarCampos(){
  document.getElementById("responsable").value = st.responsable;
  document.getElementById("otroNombre").value = st.otro;
  document.getElementById("otroNombre").classList.toggle("oculto", st.responsable!=="Otra");
  document.getElementById("fecha").value = st.fecha;
  document.getElementById("obsDesperfectos").value = st.obs.d;
  document.getElementById("obsProductos").value = st.obs.p;
  document.getElementById("obsObjetos").value = st.obs.o;
  document.getElementById("obsOtros").value = st.obs.c;
  document.getElementById("finSi").classList.toggle("on", st.final==="SÍ");
  document.getElementById("finNo").classList.toggle("on", st.final==="NO");
}
function cambioResp(){
  const v = document.getElementById("responsable").value;
  document.getElementById("otroNombre").classList.toggle("oculto", v!=="Otra");
  guardarBorrador();
}
let tBorr;
function guardarBorrador(){
  st.responsable = document.getElementById("responsable").value;
  st.otro = document.getElementById("otroNombre").value;
  st.fecha = document.getElementById("fecha").value;
  st.obs = {d:val("obsDesperfectos"), p:val("obsProductos"), o:val("obsObjetos"), c:val("obsOtros")};
  clearTimeout(tBorr); tBorr = setTimeout(guardarLocal, 300);
}
function guardarLocal(){
  // en el borrador solo se guarda la imagen de las fotos que aún no se subieron
  const copia = JSON.parse(JSON.stringify(st));
  Object.values(copia.fotos||{}).forEach(fs=>fs.forEach(f=>{ if(f.estado==="ok" && SCRIPT_URL) delete f.local; }));
  try{ localStorage.setItem(LS_BORRADOR, JSON.stringify(copia)); }
  catch(e){ Object.values(copia.fotos||{}).forEach(fs=>fs.forEach(f=>delete f.local)); ls(LS_BORRADOR, copia); }
}
function val(id){return document.getElementById(id).value;}

/* ====== GUARDAR ====== */
function nombreResp(){return st.responsable==="Otra" ? (st.otro.trim()||"Otra") : st.responsable;}
function construirRegistro(){
  const {total,hechos} = contar();
  const pendientes=[], incidencias=[], porSeccion=[];
  CHECKLIST.forEach(sec=>{
    const its = itemsDe(sec);
    its.forEach((txt,i)=>{
      const k=key(sec.id,i);
      if(st.inc[k]) incidencias.push(`${sec.t.replace(/^\d+\.\s*/,"")} – ${txt} → ${st.inc[k].trim()}`);
      if(!st.hechos[k] && !(sec.opcional && !st.profunda)) pendientes.push(`${sec.t.replace(/^\d+\.\s*/,"")} – ${txt}`);
    });
    porSeccion.push(`${sec.t}: ${sec.opcional&&!st.profunda?"no tocaba":sec._h+"/"+sec._n}`);
  });
  const ahora = new Date();
  return {
    id: st.id,
    fecha: st.fecha,
    horaInicio: new Date(st.inicio).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false}),
    horaFin: ahora.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false}),
    responsable: nombreResp(),
    profunda: st.profunda ? "SÍ" : "NO",
    hechos, total, porcentaje: total?Math.round(hechos/total*100):0,
    finalizada: st.final,
    porSeccion: porSeccion.join("\n"),
    pendientes: pendientes.join("\n"),
    incidencias: incidencias.join("\n"),
    desperfectos: st.obs.d.trim(), productos: st.obs.p.trim(), objetos: st.obs.o.trim(), comentarios: st.obs.c.trim(),
    fotos: todasLasFotos().filter(x=>x.f.estado==="ok" && x.f.fileId).map(x=>textoItem(x.k)+"|"+x.f.fileId).join("\n"),
    fotosLocal: SCRIPT_URL ? undefined : todasLasFotos().map(x=>({n:textoItem(x.k), src:x.f.local})),
    nFotos: todasLasFotos().filter(x=>x.f.estado==="ok").length,
    guardado: ahora.toISOString()
  };
}
function pedirGuardar(){
  guardarBorrador();
  if(!st.responsable || (st.responsable==="Otra" && !st.otro.trim())) return toast("Elige quién hace la limpieza");
  if(!st.final) return toast("Marca abajo si la limpieza quedó finalizada (SÍ / NO)");
  if(subiendo>0) return toast(`Espera: todavía se están subiendo ${subiendo} foto${subiendo>1?"s":""}`);
  const {total,hechos} = contar();
  const faltan = total-hechos;
  const fallidas = todasLasFotos().filter(x=>x.f.estado==="error").length;
  let txt = faltan ? `Quedan ${faltan} tareas sin marcar. Se guardarán como pendientes.` : "Todas las tareas están marcadas. ¡Muy bien!";
  if(fallidas) txt += ` Ojo: ${fallidas} foto${fallidas>1?"s no se pudieron":" no se pudo"} subir (toca la foto para reintentar, o mándala por WhatsApp).`;
  modal("¿Guardar la limpieza?", txt, guardar);
}
async function guardar(){
  const reg = construirRegistro();
  const b = document.getElementById("btnGuardar"); b.disabled=true; b.textContent="Guardando…";
  const ok = await enviar(reg);
  if(ok && ok.carpetaUrl) reg.carpetaFotos = ok.carpetaUrl;
  b.disabled=false; b.textContent="Guardar limpieza";
  if(!ok){
    const p = ls(LS_PEND)||[]; p.push(reg); ls(LS_PEND,p);
    toast("Sin conexión: quedó guardada en el teléfono y se enviará sola más tarde");
  } else toast("✅ Limpieza guardada en el historial");
  ofrecerWhatsApp(reg);
  st = nuevoEstado(); ls(LS_BORRADOR, st); cargarCampos(); pintar(); window.scrollTo(0,0);
}
async function enviar(reg){
  if(!SCRIPT_URL){ const h=ls(LS_DEMO)||[]; h.unshift(reg); ls(LS_DEMO,h); return true; }
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({accion:"guardar",registro:reg})});
    const j = await r.json(); return j.ok===true ? j : false;
  }catch(e){ return false; }
}
async function enviarPendientes(){
  const p = ls(LS_PEND)||[]; if(!p.length) return;
  const quedan=[];
  for(const reg of p){ if(!(await enviar(reg))) quedan.push(reg); }
  ls(LS_PEND, quedan);
  if(quedan.length<p.length) toast("Se enviaron limpiezas que estaban pendientes");
}
function ofrecerWhatsApp(reg){
  setTimeout(()=>modal("Enviar resumen por WhatsApp",
    "Abre WhatsApp con el resumen de la limpieza para avisar que terminaste.",
    ()=>{ location.href = "https://wa.me/?text="+encodeURIComponent(textoResumen(reg)); }, "Abrir WhatsApp"), 600);
}
function textoResumen(r){
  let t = `🧹 *Limpieza Depto Tucumán*\n📅 ${fmtFecha(r.fecha)} · ${r.horaInicio}–${r.horaFin}\n👤 ${r.responsable}\n✅ ${r.hechos}/${r.total} tareas (${r.porcentaje}%)${r.profunda==="SÍ"?" · con limpieza profunda":""}\nFinalizada: ${r.finalizada}`;
  if(r.incidencias) t += `\n\n⚠️ *Incidencias:*\n• `+r.incidencias.split("\n").join("\n• ");
  if(r.desperfectos) t += `\n\n🔧 Desperfectos: ${r.desperfectos}`;
  if(r.productos) t += `\n🧴 Faltan: ${r.productos}`;
  if(r.objetos) t += `\n🎒 Objetos olvidados: ${r.objetos}`;
  if(r.comentarios) t += `\n💬 ${r.comentarios}`;
  if(r.nFotos) t += `\n\n📸 ${r.nFotos} foto${r.nFotos>1?"s":""} subida${r.nFotos>1?"s":""}${r.carpetaFotos?": "+r.carpetaFotos:""}`;
  if(r.pendientes) t += `\n\n⏳ *Sin hacer:*\n• `+r.pendientes.split("\n").join("\n• ");
  return t;
}
function pedirReinicio(){
  modal("¿Vaciar el checklist?","Se borra lo marcado y lo escrito en esta limpieza (el historial no se toca).",()=>{
    if(SCRIPT_URL && todasLasFotos().some(x=>x.f.fileId)) fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({accion:"descartar",limpiezaId:st.id})}).catch(()=>{});
    st=nuevoEstado(); ls(LS_BORRADOR,st); cargarCampos(); pintar(); toast("Checklist vacío");
  });
}

/* ====== HISTORIAL ====== */
async function cargarHistorial(){
  const lista = document.getElementById("listaHist");
  lista.innerHTML = `<div class="vacio">Cargando…</div>`;
  if(!SCRIPT_URL){ historial = ls(LS_DEMO)||[]; return pintarHistorial(); }
  try{
    const r = await fetch(SCRIPT_URL+"?accion=historial");
    const j = await r.json();
    historial = j.registros||[];
    pintarHistorial();
  }catch(e){ lista.innerHTML = `<div class="vacio">No se pudo cargar el historial. Revisa la conexión y toca ↻ Actualizar.</div>`; }
}
function fmtFecha(f){ if(!f) return ""; const [y,m,d]=String(f).slice(0,10).split("-"); return `${d}/${m}/${y}`; }
function lista(txt){ return txt ? "<ul>"+String(txt).split("\n").filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join("")+"</ul>" : ""; }
function fotosDe(r){
  if(r.fotosLocal) return r.fotosLocal.filter(f=>f.src).map(f=>({n:f.n, src:f.src, href:f.src}));
  return String(r.fotos||"").split("\n").filter(l=>l.includes("|")).map(l=>{const [n,id]=l.split("|");
    return {n, src:thumbDrive(id,300), href:`https://drive.google.com/file/d/${id}/view`};});
}
function pintarHistorial(){
  const f = document.getElementById("filtroResp").value;
  const regs = historial.filter(r=>!f || r.responsable===f);
  const el = document.getElementById("listaHist");
  if(!regs.length){ el.innerHTML = `<div class="vacio">Todavía no hay limpiezas guardadas.</div>`; return; }
  el.innerHTML = regs.map(r=>{
    const nInc = r.incidencias ? String(r.incidencias).split("\n").filter(Boolean).length : 0;
    const hayObs = r.desperfectos||r.productos||r.objetos||r.comentarios;
    return `<div class="hist" onclick="this.classList.toggle('abierta')">
      <div class="l1"><span>${fmtFecha(r.fecha)} · ${esc(r.responsable)}</span><span>${r.porcentaje}%</span></div>
      <div class="l2">${esc(r.horaInicio)}–${esc(r.horaFin)} · ${r.hechos}/${r.total} tareas</div>
      <span class="tag ${r.finalizada==="SÍ"?"ok":"no"}">Finalizada: ${esc(r.finalizada)}</span>
      ${nInc?`<span class="tag inc">⚠️ ${nInc} incidencia${nInc>1?"s":""}</span>`:""}
      ${hayObs?`<span class="tag inc">📝 Observaciones</span>`:""}
      ${r.profunda==="SÍ"?`<span class="tag prof">🧽 Profunda</span>`:""}
      ${fotosDe(r).length?`<span class="tag prof">📸 ${fotosDe(r).length} fotos</span>`:""}
      <div class="detalle">
        ${fotosDe(r).length?`<h4>Fotos</h4><div class="galeria">${fotosDe(r).map(f=>`<a href="${f.href}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="${esc(f.n)}"><img src="${f.src}" loading="lazy" alt="${esc(f.n)}"></a>`).join("")}</div>${r.carpetaFotos?`<div style="margin-top:6px"><a href="${esc(r.carpetaFotos)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📁 Abrir carpeta de fotos</a></div>`:""}`:""}
        ${nInc?`<h4>Incidencias</h4>${lista(r.incidencias)}`:""}
        ${r.desperfectos?`<h4>Desperfectos</h4>${esc(r.desperfectos)}`:""}
        ${r.productos?`<h4>Productos que faltan</h4>${esc(r.productos)}`:""}
        ${r.objetos?`<h4>Objetos olvidados</h4>${esc(r.objetos)}`:""}
        ${r.comentarios?`<h4>Otros comentarios</h4>${esc(r.comentarios)}`:""}
        ${r.pendientes?`<h4>Tareas sin hacer</h4>${lista(r.pendientes)}`:"<h4>Tareas</h4>Todas hechas ✅"}
        ${r.porSeccion?`<h4>Por sección</h4>${lista(r.porSeccion)}`:""}
      </div></div>`;
  }).join("");
}

/* ====== UI ====== */
function verTab(t){
  const h = t==="hist";
  document.getElementById("vistaCheck").classList.toggle("oculto",h);
  document.getElementById("vistaHist").classList.toggle("oculto",!h);
  document.getElementById("pie").classList.toggle("oculto",h);
  document.getElementById("barraWrap").classList.toggle("oculto",h);
  document.getElementById("tabCheck").classList.toggle("on",!h);
  document.getElementById("tabHist").classList.toggle("on",h);
  if(h) cargarHistorial();
  window.scrollTo(0,0);
}
let tToast;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tToast);tToast=setTimeout(()=>t.classList.remove("on"),3200);}
function modal(tit,txt,ok,okTxt){
  document.getElementById("mTit").textContent=tit; document.getElementById("mTxt").textContent=txt;
  const b=document.getElementById("mOk"); b.textContent=okTxt||"Aceptar";
  b.onclick=()=>{cerrarModal(); ok();};
  document.getElementById("modal").classList.add("on");
}
function cerrarModal(){document.getElementById("modal").classList.remove("on");}

/* ====== INICIO ====== */
const b = ls(LS_BORRADOR);
if(b && b.hechos){
  st = Object.assign(nuevoEstado(), b);
  st.fotos = st.fotos||{};
  Object.values(st.fotos).forEach(fs=>fs.forEach(f=>{ if(f.estado==="subiendo") f.estado = f.local ? "error" : "ok"; }));
}
if(!SCRIPT_URL) document.getElementById("avisoDemo").classList.remove("oculto");
initCampos(); pintar();
enviarPendientes();
window.addEventListener("online", enviarPendientes);
</script>
</body>
